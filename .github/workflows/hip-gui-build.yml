name: HIP GUI build (gfx1100, pre-merge)

# Throwaway pre-merge validation build: bundles the fork's HIP engine (with
# the temporary GGML override) into a real Tauri NSIS installer so the GUI
# can be exercised on the physical RX 7900 XTX machine before any upstream
# PR is merged. Lives on ci/* branches only; never part of a PR diff.

on:
  push:
    branches: [ci/hip-gui-e2e2]
  workflow_dispatch:
    inputs:
      engine_sha:
        description: 'AIwork4me/yue2.cpp commit to build the engine from'
        default: "3c8b35b7"
      ggml_sha:
        description: 'AIwork4me/ggml commit staged into the engine submodule'
        default: '39927eae359a6a57118c179e63287d699627fb20'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      ENGINE_SHA: ${{ github.event.inputs.engine_sha || 'df4b193' }}
      GGML_SHA: ${{ github.event.inputs.ggml_sha || '39927eae359a6a57118c179e63287d699627fb20' }}
      ROCM_PATH: C:\rocm
    steps:
      - uses: actions/checkout@v4

      - name: Ninja preflight
        shell: pwsh
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }

      - name: Engine source (fork HEAD + temporary GGML override)
        shell: pwsh
        run: |
          git clone --recurse-submodules https://github.com/AIwork4me/yue2.cpp.git D:\engine\yue2.cpp
          git -C D:\engine\yue2.cpp fetch origin $env:ENGINE_SHA
          git -C D:\engine\yue2.cpp checkout --detach $env:ENGINE_SHA
          git -C D:\engine\yue2.cpp submodule update --init --recursive
          git -C D:\engine\yue2.cpp\ggml fetch https://github.com/AIwork4me/ggml.git $env:GGML_SHA
          git -C D:\engine\yue2.cpp\ggml checkout --detach $env:GGML_SHA
          "engine $(git -C D:\engine\yue2.cpp rev-parse HEAD)"
          "ggml   $(git -C D:\engine\yue2.cpp\ggml rev-parse HEAD)"

      - name: ROCm 10.1 gfx110X SDK
        shell: pwsh
        run: |
          $url = 'https://stable.repo.amd.com/rocm/core/tarball/therock-dist-windows-gfx110X-all-10.1.0.tar.gz'
          curl.exe -L --retry 3 -o D:\therock.tar.gz $url
          $hash = (Get-FileHash D:\therock.tar.gz -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '1313633026b05f8f6af2a6a16a2f323211dd81a904a808f0ee34d2bbfb8f8441') { throw "SDK tarball hash mismatch: $hash" }
          New-Item -ItemType Directory -Force -Path C:\rocm | Out-Null
          tar -xzf D:\therock.tar.gz -C C:\rocm
          Remove-Item D:\therock.tar.gz -Force

      - name: Build the engine (buildhip.cmd)
        shell: cmd
        run: |
          cd /d D:\engine\yue2.cpp
          set HIP_ARCHS=gfx1100
          call buildhip.cmd

      - name: Stage the HIP engine and its ROCm runtime closure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $PWD 'desktop\src-tauri\resources\yue2-cpp'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $bin = 'D:\engine\yue2.cpp\build-hip'
          Copy-Item (Join-Path $bin 'yue-server.exe') $dest -Force
          Get-ChildItem $bin -Filter '*.dll' -File | Copy-Item -Destination $dest -Force
          if (-not (Test-Path (Join-Path $dest 'ggml-hip.dll'))) { throw 'ggml-hip.dll missing from the engine build' }
          $rocmBin = 'C:\rocm\bin'
          foreach ($library in @('amdhip64*.dll', 'hipblas.dll', 'rocblas.dll', 'rocsolver.dll', 'libhipblaslt.dll', 'origami.dll', 'amd_comgr.dll', 'rocm_kpack.dll')) {
            $found = Get-ChildItem $rocmBin -Filter $library -File -ErrorAction SilentlyContinue
            if (-not $found) { throw "HIP runtime library '$library' not found under $rocmBin" }
            $found | Copy-Item -Destination $dest -Force
          }
          foreach ($dataDir in @('rocblas', 'hipblaslt')) {
            $src = Join-Path $rocmBin $dataDir
            if (Test-Path $src) { Copy-Item $src -Destination $dest -Recurse -Force }
          }
          $kpack = 'C:\rocm\.kpack'
          if (Test-Path $kpack) { Copy-Item $kpack -Destination $dest -Recurse -Force }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $redist = Get-ChildItem (Join-Path $vsRoot 'VC\Redist\MSVC') -Directory | Where-Object { $_.Name -match '^\d' } | Sort-Object { [version]$_.Name } | Select-Object -Last 1
          $crt = Get-ChildItem (Join-Path $redist.FullName 'x64') -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          $openmp = Get-ChildItem (Join-Path $redist.FullName 'x64') -Directory -Filter 'Microsoft.VC*.OpenMP' | Select-Object -First 1
          foreach ($library in @("$($crt.FullName)\msvcp140.dll", "$($crt.FullName)\msvcp140_1.dll", "$($crt.FullName)\vcruntime140.dll", "$($crt.FullName)\vcruntime140_1.dll", "$($openmp.FullName)\vcomp140.dll")) {
            if (-not (Test-Path $library)) { throw "VC runtime library missing: $library" }
            Copy-Item $library $dest -Force
          }
          $stamp = [pscustomobject]@{
            commit = $env:ENGINE_SHA
            backend = 'hip'
            ggml_override = $env:GGML_SHA
            runtime = 'yue-server.exe'
          }
          [System.IO.File]::WriteAllText((Join-Path $dest 'runtime.json'), ($stamp | ConvertTo-Json), (New-Object System.Text.UTF8Encoding($false)))
          New-Item -ItemType Directory -Force -Path (Join-Path $PWD 'desktop\src-tauri\resources\vst-host') | Out-Null
          Get-ChildItem $dest | Select-Object Name, Length | Format-Table | Out-String | Write-Host

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Interface install
        run: npm --prefix app ci --no-audit --no-fund

      - name: Desktop install
        run: npm --prefix desktop ci --no-audit --no-fund

      - name: Throwaway updater key (test builds only)
        shell: pwsh
        run: |
          $key = Join-Path $env:USERPROFILE '.tauri\hip-ci.key'
          npm --prefix desktop exec tauri -- signer generate --password "" -w $key --ci
          "TAURI_SIGNING_PRIVATE_KEY=$((Get-Content -Raw $key).Trim())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAURI_UPDATER_PUBKEY=$((Get-Content -Raw "$key.pub").Trim())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compose the release config and build the NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tauriRoot = Join-Path $PWD 'desktop\src-tauri'
          $version = (Get-Content -Raw (Join-Path $tauriRoot 'tauri.conf.json') | ConvertFrom-Json).version
          $config = Get-Content -Raw (Join-Path $tauriRoot 'tauri.release.conf.template.json')
          $config = $config.Replace('__TAURI_UPDATER_PUBKEY__', $env:TAURI_UPDATER_PUBKEY)
          $config = $config.Replace('__RELEASE_VERSION__', $version)
          $releaseConfigPath = Join-Path $tauriRoot 'tauri.release.conf.json'
          [System.IO.File]::WriteAllText($releaseConfigPath, $config, (New-Object System.Text.UTF8Encoding($false)))
          Push-Location (Join-Path $PWD 'desktop')
          try { npm exec tauri build -- --config $releaseConfigPath --bundles nsis; if ($LASTEXITCODE -ne 0) { throw 'tauri build failed' } }
          finally { Pop-Location }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: yue2-studio-hip-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*

      - name: Upload staged engine bundle
        uses: actions/upload-artifact@v4
        with:
          name: yue2-hip-engine-bundle
          path: desktop/src-tauri/resources/yue2-cpp/
